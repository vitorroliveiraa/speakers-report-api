worker_processes 1;

events {
  worker_connections 1024;
}

http {
  ##
  # 🔐 HTTPS para a API
  ##
  server {
    listen 443 ssl;
    server_name toolboxlds.avtechsolucoes.com.br;

    ssl_certificate /etc/letsencrypt/live/toolboxlds.avtechsolucoes.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toolboxlds.avtechsolucoes.com.br/privkey.pem;

    # 🔁 Rotas para a API
    location /api/ {
      proxy_pass http://127.0.0.1:3000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header X-Powered-By;
    }
  }

  ##
  # 🌐 Redirecionamento HTTP → HTTPS
  ##
  server {
    listen 80;
    server_name toolboxlds.avtechsolucoes.com.br;
    return 301 https://$host$request_uri;
  }
}
