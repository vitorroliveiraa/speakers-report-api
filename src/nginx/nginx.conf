worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Configurações de timeout
  proxy_connect_timeout 60s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  # Configurações de buffer
  proxy_buffer_size 4k;
  proxy_buffers 4 32k;
  proxy_busy_buffers_size 64k;

  ##
  # 🔐 HTTPS para a API
  ##
  server {
    listen 443 ssl;
    server_name toolboxlds.avtechsolucoes.com.br;

    # Configurações SSL melhoradas
    ssl_certificate /etc/letsencrypt/live/toolboxlds.avtechsolucoes.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toolboxlds.avtechsolucoes.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 🔁 Rotas para a API
    location /api/ {
      proxy_pass http://api-production:3000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header X-Powered-By;
    }
  }

  ##
  # 🌐 Redirecionamento HTTP → HTTPS
  ##
  server {
    listen 80;
    server_name toolboxlds.avtechsolucoes.com.br;
    return 301 https://$host$request_uri;
  }
}
